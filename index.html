<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모패드</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* NAVER STYLE */
        :root {
            --primary: #03c75a;
            --primary-dark: #02b350;
            --primary-light: #e8f9f0;
            --text-dark: #1a1a1a;
            --text-gray: #666666;
            --text-light: #999999;
            --border: #e5e5e5;
            --bg: #f7f8fb;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Apple SD Gothic Neo', 'Nanum Gothic', 'Malgun Gothic', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            color: var(--text-dark);
        }

        /* 네이버 스타일 상단 헤더 */
        .header {
            width: 100%;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            height: 56px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .header-logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .header-logo span {
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 640px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* 메모 입력 카드 */
        .input-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .input-card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 14px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--white);
            color: var(--text-dark);
            font-family: inherit;
            font-size: 14px;
            min-height: 44px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: var(--text-light);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(3, 199, 90, 0.12);
        }

        button {
            padding: 11px 20px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            min-height: 44px;
            transition: background 0.15s;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        button:active {
            background: #029e47;
        }

        button:disabled {
            background: #cccccc;
            color: #888888;
            cursor: not-allowed;
        }

        /* 상태 메시지 */
        .status {
            position: static !important;
            width: auto !important;
            height: auto !important;
            padding: 10px 14px !important;
            margin: 0 0 12px 0 !important;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 13px;
            font-weight: 600;
            display: block !important;
            overflow: visible !important;
            clip: auto !important;
            white-space: normal !important;
            animation: fadeIn 0.3s ease-out;
        }

        .status.error {
            background: #fff0f0;
            color: #d93025;
            border-color: #ffc9c9;
        }

        .status.success {
            background: var(--primary-light);
            color: var(--primary-dark);
            border-color: #b2edce;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 메모 목록 섹션 */
        .memos-section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .memos-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--white);
        }

        .memos-header-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .memos-count {
            font-size: 12px;
            color: var(--text-light);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 10px;
        }

        .memos {
            display: flex;
            flex-direction: column;
        }

        .memo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--white);
            transition: background 0.15s;
        }

        .memo:last-child {
            border-bottom: none;
        }

        .memo:hover {
            background: #fafafa;
        }

        .memo-icon {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
        }

        .memo-text {
            flex: 1;
            color: var(--text-dark);
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .delete-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            min-height: 30px;
            display: flex;
            align-items: center;
            font-family: inherit;
        }

        .delete-btn:hover {
            background: #fff0f0;
            color: #d93025;
            border-color: #ffc9c9;
        }

        .empty {
            text-align: center;
            padding: 60px 40px;
            color: var(--text-light);
            font-size: 14px;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* 접근성: Screen reader only content */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* 삭제 확인 모달 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 12px;
            padding: 28px 24px 20px;
            min-width: 300px;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .modal-text {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-actions button {
            padding: 9px 20px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            min-height: auto;
            box-shadow: none;
        }

        .modal-actions .cancel-btn {
            background: var(--bg);
            color: var(--text-gray);
            border: 1px solid var(--border);
        }

        .modal-actions .cancel-btn:hover {
            background: #eeeeee;
        }

        .modal-actions .confirm-btn {
            background: #d93025;
            color: var(--white);
        }

        .modal-actions .confirm-btn:hover {
            background: #c12a1f;
        }

        /* 접근성: 포커스 인디케이터 */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* 모바일 반응형 (480px 이하) */
        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
                margin: 16px auto;
            }

            .input-card {
                padding: 16px;
                border-radius: 10px;
            }

            .input-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .memos-section {
                border-radius: 10px;
            }

            .memo {
                padding: 14px 16px;
            }

            .memos-header {
                padding: 14px 16px;
            }
        }

        /* 데스크톱 (769px 이상) */
        @media (min-width: 769px) {
            .container {
                margin: 32px auto;
            }
        }
    </style>
</head>
<body>
    <!-- 네이버 스타일 상단 헤더 -->
    <header class="header">
        <span class="header-logo">MEMO<span>PAD</span></span>
    </header>

    <div class="container">
        <!-- 상태 메시지 -->
        <output id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></output>

        <!-- 메모 입력 카드 -->
        <div class="input-card">
            <div class="input-card-title">새 메모 작성</div>
            <div class="input-group">
                <label for="memoInput" class="sr-only">메모 내용</label>
                <input
                    type="text"
                    id="memoInput"
                    placeholder="메모를 입력하세요"
                    autocomplete="off"
                    aria-describedby="memo-help"
                >
                <span id="memo-help" class="sr-only">메모를 입력하고 추가 버튼을 누르거나 Enter를 누르세요</span>
                <button id="addBtn" aria-label="메모 추가">등록</button>
            </div>
        </div>

        <!-- 메모 목록 섹션 -->
        <div class="memos-section">
            <div class="memos-header">
                <span class="memos-header-title">메모 목록</span>
                <span class="memos-count" id="memosCount">0개</span>
            </div>
            <div class="memos" id="memosList" role="list" aria-label="메모 목록"></div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-title">메모 삭제</div>
            <div class="modal-text">이 메모를 삭제하시겠습니까?<br>삭제한 메모는 복구할 수 없습니다.</div>
            <div class="modal-actions">
                <button class="cancel-btn" id="cancelBtn">취소</button>
                <button class="confirm-btn" id="confirmBtn">삭제</button>
            </div>
        </div>
    </div>

    <script>
        // 설정 (⚠️ 본 환경에서는 환경변수로 관리: process.env.SUPABASE_URL, process.env.SUPABASE_KEY)
        const SUPABASE_URL = 'https://zzefmhesoxbvrfqdvcuh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_A46fGSuL4_A5FUEqWws_HQ_M2NzkDkn';

        // DOM 요소
        const memoInput = document.getElementById('memoInput');
        const addBtn = document.getElementById('addBtn');
        const memosList = document.getElementById('memosList');
        const statusDiv = document.getElementById('status');

        // 상태 변수
        let sbClient = null;
        let memoList = [];
        let loading = false;
        let pendingDeleteId = null;

        console.log('=== 메모 앱 시작 ===');

        // Supabase 초기화
        async function init() {
            try {
                console.log('Supabase 초기화 중...');

                if (!window.supabase) {
                    throw new Error('Supabase 라이브러리 로드 실패');
                }

                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 클라이언트 생성 완료');

                // 테이블 접근 테스트
                const { data, error } = await sbClient
                    .from('memos')
                    .select('count', { count: 'exact' })
                    .limit(1);

                if (error) {
                    console.error('❌ 테이블 접근 실패:', error.message);
                    showStatus('테이블 접근 실패: ' + error.message, 'error');
                    return;
                }

                console.log('✅ memos 테이블 접근 성공');
                showStatus('✅ Supabase 연결 완료', 'success');

                loadMemoList();
            } catch (err) {
                console.error('❌ 초기화 실패:', err.message);
                showStatus('초기화 실패: ' + err.message, 'error');
            }
        }

        // 메시지 표시
        function showStatus(msg, type) {
            statusDiv.innerHTML = msg;
            statusDiv.className = type;
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.innerHTML = '';
                    statusDiv.className = '';
                }, 2000);
            }
        }

        // 메모 목록 로드
        async function loadMemoList() {
            if (!sbClient) return;

            try {
                console.log('메모 조회 중...');
                const { data, error } = await sbClient
                    .from('memos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                memoList = data || [];
                console.log('✅ 메모 조회 완료:', memoList.length, '개');
                renderList();
            } catch (err) {
                console.error('❌ 조회 실패:', err.message);
                showStatus('조회 실패: ' + err.message, 'error');
            }
        }

        // 메모 목록 렌더링
        function renderList() {
            const countEl = document.getElementById('memosCount');
            if (countEl) countEl.textContent = memoList.length + '개';

            if (memoList.length === 0) {
                memosList.innerHTML = '<div class="empty"><div class="empty-icon">📝</div>등록된 메모가 없습니다</div>';
                return;
            }

            memosList.innerHTML = memoList.map(item => `
                <div class="memo" role="listitem">
                    <div class="memo-icon"></div>
                    <span class="memo-text">${escapeHTML(item.content)}</span>
                    <button class="delete-btn" data-id="${item.id}" aria-label="메모 삭제: ${escapeHTML(item.content).substring(0, 20)}">삭제</button>
                </div>
            `).join('');

            memosList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.dataset.id);
                    deleteMemoItem(id);
                });
            });
        }

        // 메모 추가
        async function addMemo() {
            if (loading || !sbClient) return;

            const text = memoInput.value.trim();
            if (!text) return;

            loading = true;
            addBtn.disabled = true;
            const originalText = addBtn.textContent;
            addBtn.textContent = '추가 중...';

            try {
                console.log('메모 추가 중...');
                const { error } = await sbClient
                    .from('memos')
                    .insert([{ content: text }]);

                if (error) throw error;

                console.log('✅ 메모 추가 완료');
                memoInput.value = '';
                showStatus('✅ 추가됨', 'success');
                await loadMemoList();
                memoInput.focus();
            } catch (err) {
                console.error('❌ 추가 실패:', err.message);
                showStatus('❌ 추가 실패: ' + err.message, 'error');
            } finally {
                loading = false;
                addBtn.disabled = false;
                addBtn.textContent = originalText;
            }
        }

        // 메모 삭제
        function deleteMemoItem(id) {
            if (!sbClient || loading) return;

            pendingDeleteId = id;
            const deleteModal = document.getElementById('deleteModal');
            deleteModal.classList.add('show');
        }

        // 실제 삭제 실행
        async function executeDelete() {
            if (!sbClient || loading || !pendingDeleteId) return;

            const id = pendingDeleteId;
            loading = true;
            const deleteBtn = document.querySelector(`[data-id="${id}"]`);
            if (deleteBtn) {
                deleteBtn.disabled = true;
                deleteBtn.textContent = '삭제 중...';
            }

            try {
                console.log('메모 삭제 중, ID:', id);
                const { error } = await sbClient
                    .from('memos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                console.log('✅ 메모 삭제 완료');
                showStatus('✅ 삭제됨', 'success');
                await loadMemoList();
            } catch (err) {
                console.error('❌ 삭제 실패:', err.message);
                showStatus('❌ 삭제 실패: ' + err.message, 'error');
                if (deleteBtn) {
                    deleteBtn.disabled = false;
                    deleteBtn.textContent = '삭제';
                }
            } finally {
                loading = false;
                pendingDeleteId = null;
                hideDeleteModal();
            }
        }

        // 모달 닫기
        function hideDeleteModal() {
            const deleteModal = document.getElementById('deleteModal');
            deleteModal.classList.remove('show');
        }

        // XSS 방지
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 이벤트 리스너
        addBtn.addEventListener('click', addMemo);
        memoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !loading) addMemo();
        });

        // 모달 버튼 이벤트
        document.getElementById('cancelBtn').addEventListener('click', hideDeleteModal);
        document.getElementById('confirmBtn').addEventListener('click', executeDelete);
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.id === 'deleteModal') hideDeleteModal();
        });

        // 페이지 로드 완료 후 초기화
        init();
    </script>
</body>
</html>
